[package]
name = "ncd-python"
version = "0.1.0"
edition = "2021"

[lib]
# Produces `ncd.<abi>.so`, importable in Python as `import ncd`.
name = "ncd"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
kolmox = { path = "../src/lib" }
pyo3 = { version = "0.23", features = ["extension-module"] }
rayon = "1.11"
